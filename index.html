<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <!-- Google Fonts: Overpass -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="card">
    <!-- Rating state start -->
    <section id="rating-state" class="state-section">
      <div class="icon-container">
        <img src="./images/icon-star.svg" alt="Star Icon">
      </div>

      <h1 class="card-title">How did we do?</h1>

      <p class="card-description">
        Please let us know how we did with your support request. All feedback is appreciated 
        to help us improve our offering!
      </p>

      <div class="rating-options">
        <button class="rating-btn" data-value="1" aria-label="Rate 1 out of 5">1</button>
        <button class="rating-btn" data-value="2" aria-label="Rate 2 out of 5">2</button>
        <button class="rating-btn" data-value="3" aria-label="Rate 3 out of 5">3</button>
        <button class="rating-btn" data-value="4" aria-label="Rate 4 out of 5">4</button>
        <button class="rating-btn" data-value="5" aria-label="Rate 5 out of 5">5</button>
      </div>

      <button id="submit-btn" class="submit-btn">Submit</button>
    </section>
    <!-- Rating state end -->

    <!-- Thank you state start -->
    <section id="thank-you-state" class="state-section hidden">
      <img src="./images/illustration-thank-you.svg" alt="Thank you illustration" class="thank-you-img">

      <p class="selection-result">
        You selected <span id="selected-rating"></span> out of 5
      </p>

      <h2 class="card-title text-center">Thank you!</h2>

      <p class="card-description text-center">
        We appreciate you taking the time to give a rating. If you ever need more support, 
        don’t hesitate to get in touch!
      </p>
    </section>
    <!-- Thank you state end -->
  </main>
  
</body>
</html>
